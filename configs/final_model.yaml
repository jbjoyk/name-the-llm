# ==============================================================================
# FINAL COMPETITION MODEL CONFIGURATION
# Experiment: EXP_45_final_ensemble_audit
# Freeze Date: 2026-11-06
# Model: EXP_44-C Hybrid Prompt-Residual GAT + EXP_36 Soft Convex Fusion + Hungarian
# ==============================================================================

model_metadata:
  experiment_id: EXP_45_final_ensemble_audit
  git_commit: 230d7764ae5b0d9236db0d7436d7a2f161cd79f8
  status: FROZEN_CANONICAL
  primary_validation_metric: balanced_accuracy
  prespecified_cv_ba: 0.6216
  nested_cv_ba: 0.6223
  empirical_oof_ba: 0.6264
  num_classes: 18

classes:
  labels:
    - claude-fable-5
    - claude-opus-4-6
    - claude-opus-4-8
    - claude-opus-5
    - claude-sonnet-5
    - gemini-3.1-pro-preview
    - gemini-3.6-flash
    - gemini-3.7-flash
    - gemini-3.8-flash
    - glm-5.3
    - glm-5.3-flash
    - gpt-5.5
    - gpt-5.6-luna
    - gpt-5.6-sol
    - gpt-5.6-terra
    - gpt-6-astra
    - kimi-k3
    - qwen3.8-max

# Base 4-View LinearSVC Classifier (EXP_36)
svc_features:
  char_view:
    analyzer: char
    ngram_range: [3, 5]
    min_df: 3
    max_features: 120000
    sublinear_tf: true
  word_view:
    analyzer: word
    ngram_range: [1, 3]
    min_df: 2
    max_features: 80000
    sublinear_tf: true
    token_pattern: '(?u)\b\w+\b|[^\w\s]'
  shape_view:
    analyzer: char
    ngram_range: [2, 6]
    min_df: 3
    max_features: 40000
    sublinear_tf: true
  function_view:
    analyzer: word
    ngram_range: [1, 3]
    min_df: 2
    max_features: 30000
    sublinear_tf: true
  classifier:
    type: LinearSVC
    C: 0.5
    loss: squared_hinge
    class_weight: balanced
    max_iter: 2000
    random_state: 42
  open_pool:
    enabled: true
    sample_weight: 0.35
    max_samples: 18000

# Shared-Prompt Gaussian Group Head (EXP_36)
gaussian_head:
  enabled: true
  fusion_weight: 0.05
  projection_dim: 128
  input_features:
    minilm_l3: 384
    stylometry_144d: 144
    total_dim: 528

# Relational Expert: Hybrid Prompt-Residual GAT (EXP_44-C)
hybrid_gat:
  enabled: true
  feature_composition:
    minilm_l3_dim: 384
    deberta_v3_dim: 768
    stylometry_dim: 144
    total_input_dim: 1296
  architecture:
    hidden_dim: 128
    num_heads: 4
    num_layers: 2
    dropout: 0.20
    activation: GELU
  training:
    epochs: 40
    batch_size: 16
    learning_rate: 0.001
    weight_decay: 0.0001
    optimizer: AdamW
    loss: CrossEntropyLoss
    max_prompt_size: 18

# Prompt Recovery & Graph Construction
prompt_clustering:
  method: agglomerative_linkage
  linkage: average
  distance_threshold: 0.15
  max_cluster_size: 18
  vectorizer:
    analyzer: word
    stop_words: english
    min_df: 1
    max_df: 0.15
    sublinear_tf: true

# Probability Simplex Soft Convex Fusion
ensemble_policy:
  fusion_type: probability_convex_combination
  alpha_prespecified: 0.05       # Scientifically unassailable 0-DoF baseline
  alpha_empirical_optimal: 0.08  # Validated optimal plateau operating point
  formula: "P_fused = (1.0 - alpha) * P_EXP36 + alpha * P_Hybrid_GAT"

# Bipartite Assignment
post_processing:
  injective_matching: true
  solver: scipy_linear_sum_assignment
  cost_function: "-P_fused"
  per_cluster: true
  max_k_enforced: 18

# Inference Constraints & Execution Guardrails
runtime_guardrails:
  max_char_length: 30000
  nan_imputation: ""
  min_test_samples: 1
  deterministic: true
  device: cuda_preferred
  batch_size_transformers: 64
